const qs=[{"n": 1, "q": "Paciente de 36 meses con selectividad alimentaria presenta marcada disminucion del TCS y masa muscular. Durante el ayuno prolongado ¿Cual es la secuencia metabolica mas adecuada?", "opts": ["masa muscular", "", "almacenamiento de glucogeno", "Catabolismo proteico"], "correct": "D"}, {"n": 2, "q": "El PDF no muestra el enunciado completo de la pregunta 2; comienza directamente desde una de sus opciones.", "opts": ["", "", "", ""], "correct": null}, {"n": 3, "q": "Panel lateral Examen medicina interna R1 2026 Pregunta 3 Correcta Se puntúa 1,00 sobre 1,00 Marcar pregunta Enunciado de la pregunta Niño de 8 años que consulta por hematemesis abundante. Lo valoran en la guardia pálido, con frecuencia cardiada de 125lpm, pulsos debiles y relleno capilar mayor a 4segundos. ¿Cual es la conducta inicial mas adecuada?", "opts": ["circulacion", "20ml/kg", "", ""], "correct": "A"}, {"n": 4, "q": "Tomas de 9 años inicio hace 72 hs con un cuadro de conjuntivitis unilateral. La madre fue a la farmacia y le solicito “gotitas” para el ojo, las cuales viene utilizando. No recuerda el nombre. Consulta hoy en guardia porque durante la noche presento un primer registro febril,edema y dolor al movilizar el ojo. El diagnostico mas probable es...", "opts": ["", "", "", "oftalmicas"], "correct": null}, {"n": 5, "q": "Un paciente internado por una infección del sistema nervioso central presenta sodio plasmático de 124 mEq/l, osmolaridad plasmática disminuida, osmolaridad urinaria elevada, sodio urinario de 45 mEq/l, oliguria y ausencia de signos clínicos de deshidratación. ¿Cuál es el diagnóstico más probable?", "opts": ["antidiurética.", "", "extrarrenales.", ""], "correct": "A"}, {"n": 6, "q": "Un niño con insuficiencia renal presenta potasio de 7,2 mEq/l y electrocardiograma con ondas T picudas y ensanchamiento del complejo QRS. ¿Cuál es la primera intervención farmacológica indicada?", "opts": ["", "", "", ""], "correct": null}, {"n": 7, "q": "Una niña de 5 años presenta edema y eritema palpebral unilateral luego de una picadura de insecto. Está afebril, con buen estado general, agudeza visual conservada, movilidad ocular completa y sin dolor con los movimientos oculares. ¿Cuál es la conducta más adecuada?", "opts": ["evaluación quirúrgica inmediata.", "órbita y senos paranasales.", "", "clínicos estrechos. 8.Un adolescente de 14 años es internado por pérdida de 18 kg en seis meses y restricción alimentaria grave. Presenta bradicardia, atrofia muscular y un IMC muy por debajo de lo esperado. Al ingreso, el fósforo, el potasio y el magnesio plasmáticos se encuentran dentro de valores normales. Se inicia alimentación enteral con un aporte calórico elevado. A las 36 horas desarrolla debilidad generalizada, taquicardia, edemas periféricos y dificultad respiratoria. ¿Cuál es la alteración de laboratorio más probable? Pregunta 8Respuesta a. Hipernatremia. b. Hipercalcemia. c. Hiperpotasemia. d. Hipofosfatemia. 9. Una niña de 8 años presenta fiebre y rinorrea purulenta de cinco días de evolución. En las últimas 24 horas agrega edema palpebral izquierdo progresivo. Al examen presenta proptosis, dolor intenso al movilizar el ojo, limitación de la mirada superior y disminución de la agudeza visual. El hemograma muestra 18.000 leucocitos/mm³ con neutrofilia. ¿Cuál es el estudio complementario más adecuado? Pregunta 9Respuesta a. Radiografía simple de senos paranasales. b. Resonancia magnética sin contraste diferida hasta completar 48 horas de antibióticos. c. Tomografía de órbitas y senos paranasales con contraste. d. Ecografía de partes blandas del párpado. 10. Un niño de 6 años con gastroenteritis presenta vómitos y diarrea abundante. Al ingreso está taquicárdico, con mucosas secas, pulsos débiles y relleno capilar prolongado. Laboratorio: sodio 124 mEq/l, glucemia 92 mg/ dl, osmolaridad plasmática disminuida y sodio urinario de 8 mEq/l. ¿Cuál es el mecanismo más probable de la hiponatremia? Pregunta 10Respuesta a. Pérdida extrarrenal de sodio y agua, con déficit proporcionalmente mayor de sodio. b. Retención primaria de agua secundaria a SIHAD. c. Desplazamiento de agua al espacio extracelular por hiperglucemia. d. Pérdida renal de sodio por síndrome perdedor de sal cerebral. 11. Un niño de 3 años consulta por un episodio de hematoquecia abundante. Está afebril, sin diarrea y sin dolor durante la defecación. La madre refiere que previamente presentó episodios menores de sangrado rojo oscuro. Al examen no se observan fisuras anales. Horas después presenta palidez y taquicardia, pero el abdomen continúa blando e indoloro. ¿Cuál es el diagnóstico que debe considerarse prioritariamente? Pregunta 11Respuesta a. Enterocolitis infecciosa. b. Divertículo de Meckel. c. Púrpura de Schönlein-Henoch. d. Fisura anal. 12 Un niño de 7 años consulta por vómitos con sangre. Está lúcido y normotenso, pero presenta taquicardia, palidez y relleno capilar de 3 segundos. La hemoglobina inicial es de 11,5 g/ dl. ¿Cuál de las siguientes afirmaciones es correcta? Pregunta 12Respuesta a. Debe aguardarse el descenso de la hemoglobina antes de iniciar la estabilización. b. La ausencia de hipotensión permite descartar compromiso hemodinámico. c. La hemoglobina inicialmente normal descarta una hemorragia significativa. d. La taquicardia puede ser un signo temprano y sensible de pérdida sanguínea. Ud. atiende a Juan de 3 años de edad, con diagnóstico de hipertrofia amigdalina y de vellosidades adenoideas (HAVA) que será sometido a adenoidectomía por presentar apneas del sueño. Luego de realizar el examen físico y constatar vacunas completas, evalúa el laboratorio realizado 1 mes previo a la cirugía que informa: Hto: 31%, Hb: 10.5 g/dl, GB: 7000 (40/1/0/50/9), Plaquetas: 350.000, KPTT: 36 segundos, y Quick: 60%. ECG: normal, riesgo quirúrgico habitual. ¿Cuál es su conducta con Juan? Pregunta 13Respuesta a. Está en condiciones de abordar la cirugía b. Repite hemograma ya que superó el mes de validez c. Indica vitamina K 5 mg IM dosis única. d. Por presentar anemia realiza transfusión de glóbulos rojos a 10 ml/kg previo a la cirugía se 14 José de 5 años, tiene diagnóstico de hiperplasia suprarrenal congénita en tratamiento suplementario con hidrocortisona a 12 mg/m2/ día, que se interna para realizar hernioplastía inguinal. Al examen físico usted evidencia una hernia inguinal derecha reductible y coercible. Constata estudios prequirúrgicos normales y vigentes, y registra un peso de 20 kgs. ¿Qué indicaciones se deben realizar para el perioperatorio de José? Pregunta 14Respuesta a. Hidrocortisona 47 mg 2 horas prequirúrgica IM + 47 mg en goteo durante la cirugía EV b. Hidrocortisona 47 mg 1 hora prequirúrgica EV+ 47 mg en goteo durante la cirugía + 12 mg c/6 hs por 48 hs EV c. Hidrocortisona 47 mg 1 hora prequirúrgica EV + 47 mg en goteo durante la cirugía + 47 mg c/6 hs por 48 hs. EV d. Solo ayuno y baño prequirúrgico. 15 Ingresa un paciente de 16 meses con deshidratacion moderada secundaria a diarrea de tres dias de evolución. Se indica un plan de hidratacion parenteral para corregir los trastornos del medio interno. Doce horas, luego de iniciado el mismo, el paciente se torna confuso y disatrico. La correccion rapida de que ion puede originar estos síntomas? Pregunta 15Respuesta a. Na+ b. Ca++ c. Mg++ d. K+ 16 FSG"], "correct": "C"}, {"n": 8, "q": "a. Internación, antibioticoterapia endovenosa y evaluación quirúrgica inmediata. b. Realización obligatoria de una tomografía de órbita y senos paranasales. c. Tratamiento exclusivo con antihistamínicos. d. Tratamiento antibiótico por vía oral y controles clínicos estrechos. 8.Un adolescente de 14 años es internado por pérdida de 18 kg en seis meses y restricción alimentaria grave. Presenta bradicardia, atrofia muscular y un IMC muy por debajo de lo esperado. Al ingreso, el fósforo, el potasio y el magnesio plasmáticos se encuentran dentro de valores normales. Se inicia alimentación enteral con un aporte calórico elevado. A las 36 horas desarrolla debilidad generalizada, taquicardia, edemas periféricos y dificultad respiratoria. ¿Cuál es la alteración de laboratorio más probable?", "opts": ["", "", "", ""], "correct": null}, {"n": 9, "q": "Una niña de 8 años presenta fiebre y rinorrea purulenta de cinco días de evolución. En las últimas 24 horas agrega edema palpebral izquierdo progresivo. Al examen presenta proptosis, dolor intenso al movilizar el ojo, limitación de la mirada superior y disminución de la agudeza visual. El hemograma muestra 18.000 leucocitos/mm³ con neutrofilia. ¿Cuál es el estudio complementario más adecuado?", "opts": ["", "hasta completar 48 horas de antibióticos.", "contraste.", ""], "correct": "D"}, {"n": 10, "q": "Un niño de 6 años con gastroenteritis presenta vómitos y diarrea abundante. Al ingreso está taquicárdico, con mucosas secas, pulsos débiles y relleno capilar prolongado. Laboratorio: sodio 124 mEq/l, glucemia 92 mg/ dl, osmolaridad plasmática disminuida y sodio urinario de 8 mEq/l. ¿Cuál es el mecanismo más probable de la hiponatremia?", "opts": ["proporcionalmente mayor de sodio.", "", "por hiperglucemia.", "de sal cerebral."], "correct": "A"}, {"n": 11, "q": "Un niño de 3 años consulta por un episodio de hematoquecia abundante. Está afebril, sin diarrea y sin dolor durante la defecación. La madre refiere que previamente presentó episodios menores de sangrado rojo oscuro. Al examen no se observan fisuras anales. Horas después presenta palidez y taquicardia, pero el abdomen continúa blando e indoloro. ¿Cuál es el diagnóstico que debe considerarse prioritariamente?", "opts": ["", "", "", ""], "correct": "B"}, {"n": 12, "q": "Un niño de 7 años consulta por vómitos con sangre. Está lúcido y normotenso, pero presenta taquicardia, palidez y relleno capilar de 3 segundos. La hemoglobina inicial es de 11,5 g/ dl. ¿Cuál de las siguientes afirmaciones es correcta?", "opts": ["antes de iniciar la estabilización.", "compromiso hemodinámico.", "una hemorragia significativa.", "sensible de pérdida sanguínea."], "correct": null}, {"n": 13, "q": "Ud. atiende a Juan de 3 años de edad, con diagnóstico de hipertrofia amigdalina y de vellosidades adenoideas (HAVA) que será sometido a adenoidectomía por presentar apneas del sueño. Luego de realizar el examen físico y constatar vacunas completas, evalúa el laboratorio realizado 1 mes previo a la cirugía que informa: Hto: 31%, Hb: 10.5 g/dl, GB: 7000 (40/1/0/50/9), Plaquetas: 350.000, KPTT: 36 segundos, y Quick: 60%. ECG: normal, riesgo quirúrgico habitual. ¿Cuál es su conducta con Juan?", "opts": ["", "validez", "", "glóbulos rojos a 10 ml/kg previo a la cirugía se"], "correct": "C"}, {"n": 14, "q": "José de 5 años, tiene diagnóstico de hiperplasia suprarrenal congénita en tratamiento suplementario con hidrocortisona a 12 mg/m2/ día, que se interna para realizar hernioplastía inguinal. Al examen físico usted evidencia una hernia inguinal derecha reductible y coercible. Constata estudios prequirúrgicos normales y vigentes, y registra un peso de 20 kgs. ¿Qué indicaciones se deben realizar para el perioperatorio de José?", "opts": ["47 mg en goteo durante la cirugía EV", "47 mg en goteo durante la cirugía + 12 mg c/6 hs por 48 hs EV", "47 mg en goteo durante la cirugía + 47 mg c/6 hs por 48 hs. EV", ""], "correct": null}, {"n": 15, "q": "Ingresa un paciente de 16 meses con deshidratacion moderada secundaria a diarrea de tres dias de evolución. Se indica un plan de hidratacion parenteral para corregir los trastornos del medio interno. Doce horas, luego de iniciado el mismo, el paciente se torna confuso y disatrico. La correccion rapida de que ion puede originar estos síntomas?", "opts": ["", "", "", ""], "correct": "A"}, {"n": 16, "q": "En un paciente con acidosis metabólica, ¿cuál de los siguientes hallazgos orienta con mayor fuerza a una acidosis tubular renal?", "opts": ["", "anión gap normal.", "renal.", "17 8 Evaluaciones específicas - Pediatría Examen curso superior R1"], "correct": null}, {"n": 17, "q": "a. Elevación de lactato asociada a mala perfusión. b. QBicarbonato disminuido con hipercloremia y anión gap normal. c. Retención de ácidos orgánicos por insuficiencia renal. d. Hiperglucemia y cetonemia 17 8 Evaluaciones específicas - Pediatría Examen curso superior R1 Examen medicina interna R1 2026 Un varón de 4 meses de edad es traído a la consulta por presentar vómitos en chorro durante las últimas semanas. Al examen físico presenta pérdida de peso del 4%, mucosas semihúmedas, buen relleno capilar y una masa palpable en epigastrio. La radiografía de abdomen revela una cámara gástrica que supera la línea media. Le realiza EAB que informa: pH 7.55 pCO2 55 HCO3 48; ¿Cómo interpreta este EAB?", "opts": ["asociada con alcalemia", "", "asociada, con alcalemia", "con acidemia"], "correct": "B"}, {"n": 18, "q": "Mariano, de 6 meses, con antecedente de acidosis tubular renal tipo II, consulta por vómitos de 48 horas. Al examen presenta somnolencia, mucosas secas, enoftalmos y signo del pliegue. Laboratorio: pH 7,45; pCO₂ 37 mmHg; HCO₃⁻ 28 mEq/L; Na 122 mEq/L; K 4 mEq/L; Cl 105 mEq/L.", "opts": ["", "0,9%", "hipertónica al 3%.", ""], "correct": null}, {"n": 19, "q": "Mariano de 6 meses quien tiene diagnóstico de Acidosis Tubular Renal Tipo II, es traído a guardia por su madre por presentar vómitos de 48 horas de evolución. Al examen está somnoliento, presenta mucosas semihúmedas, enoftalmos y signo del pliegue. Usted solicita laboratorio que informa: EAB 7.45/37/28/0.5, Ionograma: 122/4/105 ¿Cuál es el riesgo de realizar una corrección rápida de sodio superando los 10 mEq/día?", "opts": ["", "", "", ""], "correct": "A"}, {"n": 20, "q": "Juan de 9 meses, peso 8.5 kgs, se encuentra en CEGP bajo control clínico por gastroenteritis aguda. Durante la observación presenta retrodesviación de la mirada y movimientos tónico-clónicos generalizados. Luego de aplicar las medidas iniciales la convulsión cede. A los 15 minutos reinicia con episodios convulsivos y constata que presenta una natremia de 123 mEq/l. ¿Cuál es su conducta en este momento?", "opts": ["natremia no es necesario corrección.", "al 3% a pasar en 20 min", "", "al 20% a pasar en 20 minutos."], "correct": null}, {"n": 21, "q": "¿Cómo se clasifican clínicamente las hiponatremias secundarias a Síndrome de Secreción Inadecuada de ADH (SIHAD)?", "opts": ["", "", "", ""], "correct": "D"}, {"n": 22, "q": "Usted se encuentra en el CEGP controlando a Martina de 2 años, cuyo peso es 16 kg y está cursando una deshidratación severa secundaria a gastroenteritis. Recibe el laboratorio que informa: Hto: 45%, Hb: 15.2 g/dl, GB: 18.500 (60/0/1/35/5), plaquetas 545.000, Urea: 54 mg/ dl, creatinina 0.8 mg/dl, EAB: 7.25/35/15/-9, Ionograma: 117/4.8/120. Con dicha natremia decide realizar una corrección de sodio. ¿Cuáles serían los mEq de Na a aportar si se tiene como objetivo un delta de Na de 10 mEq/L con ritmo de ascenso de 1 mEq/L/h? Indicar el volumen total, la concentración de solución y el goteo que indica a enfermería:", "opts": ["ml/h", "ml/h", "h", "ml/h"], "correct": null}, {"n": 23, "q": "Jorge de 13 años, de 70 kgs, está internado en el 9º y se encuentra en ayuno por abdomen agudo quirúrgico con PHP 2000 ml/m2/140/30. ¿Cuál es el flujo de potasio que presenta el plan indicado?", "opts": ["", "", "", ""], "correct": "B"}, {"n": 24, "q": "Paciente de 30 meses, previamente sano, que pesa 18 kg, consulta a la guardia por vómitos incoercibles. Al examen físico impresiona deshidratación leve. Por no quedar clara la causa de los vómitos, decide realizar laboratorio que evidencia: EAB: 7.31/32/19/-6, Ionograma: 139/2.4/98. El paciente persiste con vómitos y al evidenciar el resultado decide indicar tratamiento para corregir la kalemia. Indique la respuesta correcta.", "opts": ["goteo a 152 ml/hora a pasar en 2 horas, Ø: 0.5 mEq/k/h)", "mEq), a 4.4 mEq/k/día, 15 ml cada 6 horas.", "goteo a 228 ml/hora a pasar en 2 horas, Ø: 0.5 mEq/k/h)", "goteo a 228 ml/hora a pasar en 3 horas, Ø: 0.3 mE
