. El coagulograma tiene una validez de 1 mes. d. El hemograma tiene una validez de 6 meses 37 ¿Cuál de los siguientes procedimientos requiere profilaxis antibiótica? Pregunta 37Respuesta a. Estenosis pilórica. b. Cierre de colostomía. c. Hernia inguinal. d. Colecistectomía. 38 Con respecto a la hormona PTH: Pregunta 38Respuesta a. Actúa ante hipercalcemia. b. Disminuye la resorción ósea. c. Disminuye la reabsorción de calcio a nivel renal. d. Actúa rápidamente ante la hipocalcemia. 39 Las siguientes son causas de hipocalcemia, marque la opción INCORRECTA: Pregunta 39Respuesta a. Alteraciones de la vitamina D b. Sepsis c. Hipomagnesemia d. Antibióticos betalactámicos 40.Respecto a la hipocalcemia, cual de los siguientes enunciados es incorrecto Pregunta 40Respuesta a. Presenta temblores b. Presenta debilidad muscular c. Presenta signo de Chvostek y Trousseau d. Puede presentarse con tetania 41.Con respecto al tratamiento de la hiperfosfatemia, marque la opción CORRECTA: Pregunta 41Respuesta a. Indicar carbonato de calcio 1 a 2 g/día con las comidas. b. Al indicar quelantes de calcio no es necesario hacer restricción dietética de fosfato. c. Indicar carbonato de calcio 1 g/día lejos de las comidas. d. Restricción hídrica. 42. Con respecto a la celulitis preseptal, marque la correcta: Pregunta 42Respuesta a. Presenta afectación de la agudeza visual. b. Puede complicarse con la formación de un absceso local c. El tratamiento es exclusivamente local. d. Se diferencia de la celulitis orbitaria por la afectación de los senos paranasales. 43.Las siguientes son complicaciones de celulitis orbitaria, EXCEPTO: Pregunta 43Respuesta a. Absceso cerebral b. Meningitis c. Trombosis del seno cavernoso d. Mastoiditis 44. ¿Cuál de las siguientes es manifestación de acidosis metabólica? Pregunta 44Respuesta a. Respiración de Kussmaul b. Temblores c. Apneas d. Hipertonias 45.8 Evaluaciones específicas - Pediatría Examen curso superior R1 Examen medicina interna R1 2026 Examen medicina interna R1 2026 Pregunta 45 Correcta Se puntúa 1,00 sobre 1,00 Marcar pregunta Enunciado de la pregunta Ingresa a internación un paciente de 2 años cursando una deshidratación aguda secundaria a gastroenteritis con intolerancia a la vía oral. Usted realiza un laboratorio y coloca un plan de hidratación parenteral. El EAB informa acidosis metabólica e hipokalemia moderada. ¿Qué alteraciones podría encontrar en el ECG? Pregunta 45Respuesta a. Depresión del segmento ST b. Prolongación del PR c. Desaparición de ondas U d. Onda T picuda ¿Cuál de los siguientes NO es un tratamiento adecuado para la hipercalcemia? Pregunta 46Respuesta a. Vitamina D b. Furosemida c. Solución fisiológica 20 mL/kg EV en 1 h d. Bifosfonatos Acaba de evaluar a un bebé de 15 días de vida traído por el padre por presentar un vómito con estrías de sangre en 2 ocasiones en las últimas 24 hs. Antecedentes: RN 37 semanas EG, PN: 2.450 kg, sin antecedentes perinatológicos de importancia. Examen físico: bebé reactivo, conectado, en BEG, buen progreso de peso, PMLD exclusivo. ¿Qué conducta tomaría en 1er instancia? Pregunta 47Respuesta a. Suspensión de PM, indica leche con hidrolizado proteico extenso. b. Exclusión de lácteos de la dieta materna c. Cita para nueva evaluación en compañía de su madre. d. Hemograma y coagulograma. 48.Juan de 1 año y 6 meses es llevado a la guardia por su madre por presentar pérdida de sangre roja rutilante en materia fecal en 2 ocasiones (con y sin materia fecal forme). No refiere dolor. Afebril. El niño es sano, sin ningún antecedente de importancia. De los siguientes estudios, ¿cuál lo orientaría más en el diagnóstico de Juan? Pregunta 48Respuesta a. Coprocultivo b. Ecografia abdominal c. VEDA d. Centellografía con Tc 99 49 Identifique: ¿Cuál de las siguientes situaciones clínicas puede generar hiperkalemia en un niño previamente sano? Pregunta 49Respuesta a. Nebulizaciones repetidas con agonistas B2 b. Acidosis metabólica c. Alto flujo de glucosa con aumento consiguiente de la insulina d. Dieta con alto contenido de potasio Angel de 8 meses de edad, tiene como antecedentes de NPT (36 semanas)/PAEG, internado en neonatología. A los 5 días intervenido quirúrgicamente por enterocolitis necrotizante con resección de 15 cm de asa intestinal, conservación de válvula ileocecal y realización de colostomía en caño de escopeta. En el día de hoy se interna para cirugía programada de cierre de colostomía. Presenta estudios prequirúrgicos (laboratorio, ECG) normales. ¿Cuál es su conducta en relación a la profilaxis antibiótica? Pregunta 50Respuesta a. Indica Ampicilina-sulbactam 50 mg/kg EV b. Indica Ampicilina 150 mg/kg EV c. Indica Cefalotina 100 mg/kg EV d. No requiere profilaxis antibiótica"], "correct": "D"}, {"n": 2, "q": "Pregunta 2 incompleta en el PDF original: no se ve el enunciado ni la opción A.", "opts": ["No visible en el PDF.", "Hay alteraciones del metabolismo proteico que asocian disminución de la síntesis proteica y aumento concomitante del catabolismo proteico. Esto lleva a hipoproteinemia e hipoalbuminemia responsables del edema.", "Cursa con albúmina normal.", "Es un déficit principalmente calórico en el cual existe una alteración en la utilización de las proteínas, las cuales son desviadas al metabolismo energético."], "correct": null}, {"n": 3, "q": "Niño de 8 años que consulta por hematemesis abundante. Lo valoran en la guardia pálido, con frecuencia cardiada de 125lpm, pulsos debiles y relleno capilar mayor a 4segundos. ¿Cual es la conducta inicial mas adecuada?", "opts": ["Evaluar y estabilizar via aerea, respiracion y circulacion", "Iniciar expansion con solucion fisiologica a 20ml/kg", "Realizar una transfusion de globulos rojos", "Realizar una VEDA de urgencia 4."], "correct": "A"}, {"n": 4, "q": "Tomas de 9 años inicio hace 72 hs con un cuadro de conjuntivitis unilateral. La madre fue a la farmacia y le solicito “gotitas” para el ojo, las cuales viene utilizando. No recuerda el nombre. Consulta hoy en guardia porqu n": 27, "q": "Un paciente de 7 años concurre a la consulta para control en salud. De sus antecedentes se destacan: residencia en medio socioeconómico desfavorable hasta los 36 meses, período durante el cual debió ser hospitalizado en 4 oportunidades por deshidratación y desnutrición. Luego de esa edad fue incorporado a un ambiente urbano de nivel socioeconómico medio con cobertura de todas sus necesidades básicas. ¿Cuál es el indicador antropométrico actual más probablemente afectado?", "opts": ["Velocidad de ganancia de peso", "Peso/Edad", "Talla/Edad", "Peso/Talla 28"], "correct": "C"}, {"n": 28, "q": "Niño de 4 años, que presenta índice peso/ talla bajo y talla/edad normal; ¿cuál es el diagnóstico desde el punto de vista nutricional?", "opts": ["Secuela de desnutrición", "Desnutrición crónica reagudizada", "Desnutrición aguda", "Desnutrición crónica 29."], "correct": "C"}, {"n": 29, "q": "En cuanto al tratamiento de la desnutrición, marque la opción CORRECTA:", "opts": ["Los vómitos incoercibles son indicación de nutrición parenteral.", "zasSe recomienda la utilización de fórmulas sin lactosa en mayores de 6 años.", "Al iniciar el soporte nutricional, debe indicarse suplementación con tiamina (Vitamina B1) y realizarse laboratorios reglados por la posibilidad de hipokalemia, hipermagnesemia, hiperfostatemia e hiperglucemia durante el síndrome de realimentación.", "Debe internarse todo paciente con desnutrición grado II."], "correct": "A"}, {"n": 30, "q": "Una niña de 9 años se presenta con antecedentes de bajo peso y proctorragia intermitente sin dolor. Aproximadamente 1 o 2 veces por semana, la niña defeca materia fecal sólida con sangre. No se observan fisuras ni hemorroides. El hematocrito y los estudios de coagulación son normales. La proctorragia persiste a pesar de la dieta blanda y vaselina indicada por el pediatra de cabecera. ¿Cuál de los siguientes es el mejor examen complementario para establecer el diagnóstico?", "opts": ["Colonoscopía.", "Centellografía con Tc 99.", "Coprocultivo.", "TAC de abdomen. 31."], "correct": "A"}, {"n": 31, "q": "Juana de 10 meses de edad está internada para trasplante hepático, comenzó con hematemesis después de toser. La paciente tiene atresia de vías biliares y el procedimiento de Kasai fracasó. La frecuencia cardíaca es 150 latidos por minuto, la frecuencia respiratoria 30 respiraciones por minuto y la presión arterial 65/40 mm Hg. Cerca de la cabeza de la paciente se observa una cantidad moderada de sangre de color rojo brillante sobre las sábanas de la cama. ¿Cuál de las siguientes es la causa MÁS probable de la hemorragia?", "opts": ["Enterocolitis infecciosa.", "Epistaxis anterior.", "Várices esofágicas.", "Úlcera gástrica por estrés. 32."], "correct": "C"}, {"n": 32, "q": "Respecto a la homeostasis del magnesio, marque la opción correcta:", "opts": ["La hipomagnesemia puede ser secundaria a drogas como anfotericina, cisplatino, ciclosporina, diuréticos, aminoglucósidos y manitol.", "Todas son correctas.", "La hipomagnesemia debe ser sospechada ante pacientes con hipokalemia e hipocalcemia refractarias.", "Durante una infusión de magnesio, el paciente puede presentar hipotensión, depresión respiratoria, bloqueo cardíaco e hipermagnesemia. 33"], "correct": "B"}, {"n": 33, "q": "Juan de 7 meses, es internado por diarrea de 10 días de evolución. Su madre le ha dado abundantes líquidos: agua, té, caldo, leche diluída. Se encuentra normohidratado, decaído, pálido, taquicárdico y taquipneico, con respiraciones profundas. Laboratorio: EAB pH: 7,18/pO2 99/pCO2 28/Bic 10/EB -12. Na 128 mEq/l, K 2.2 mEq/l, Cl 102 mEq/l. ¿Qué terapéutica debe indicarse en primer término?", "opts": ["Correción rápida de potasio.", "Expansión con solución fisiológica.", "Corrección rápida de sodio.", "Corrección rápida de bicarbonato 34."], "correct": "A"}, {"n": 34, "q": "Calcule el anión gap; EAB pH: 7,18/pO2 99/ pCO2 28/Bic 10/EB -12. Na 128 mEq/l, K 2.2 mEq/l, Cl 102 mEq/l.:", "opts": ["16", "36", "13,2", "14 35"], "correct": "A"}, {"n": 35, "q": "Laura de 12 meses, con peso de 10 Kg, ingresó a la guardia hace 3 horas con una deshidratación severa secundaria a gastroenteritis. Usted se acerca a revisarla y encuentra que está recibiendo el siguiente plan de hidratación parenteral: Dx5% 250ml + SF 250ml + KCl 3M 5ml + NaCl 20% 10ml ¿Qué flujo de potasio está recibiendo? ¿Cuál es la concentración de sodio de la solución?", "opts": ["Flujo de potasio: 0,12 mEq/Kg/hora Concentración de Na: 140 mEq/L.", "Flujo de potasio: 0,04 mEq/Kg/hora. Concentración de Na: 120 mEq/L.", "Flujo de potasio: 0,08 mEq/Kg/hora. Concentración de Na: 154 mEq/L.", "Flujo de potasio: 0,25 mEq/Kg/hora. Concentración de Na: 77 mEq/L. 36"], "correct": "A"}, {"n": 36, "q": "En la atención del paciente pre quirúrgico, marque la opción correcta:", "opts": ["El ECG tiene una validez de 2 años.", "El hemograma tiene una validez de 1 mes.", "El coagulograma tiene una validez de 1 mes.", "El hemograma tiene una validez de 6 meses 37"], "correct": "B"}, {"n": 37, "q": "¿Cuál de los siguientes procedimientos requiere profilaxis antibiótica?", "opts": ["Estenosis pilórica.", "Cierre de colostomía.", "Hernia inguinal.", "Colecistectomía. 38"], "correct": "B"}, {"n": 38, "q": "Con respecto a la hormona PTH:", "opts": ["Actúa ante hipercalcemia.", "Disminuye la resorción ósea.", "Disminuye la reabsorción de calcio a nivel renal.", "Actúa rápidamente ante la hipocalcemia. 39"], "correct": "D"}, {"n": 39, "q": "Las siguientes son causas de hipocalcemia, marque la opción INCORRECTA:", "opts": ["Alteraciones de la vitamina D", "Sepsis", "Hipomagnesemia", "Antibióticos betalactámicos 40."], "correct": "D"}, {"n": 40, "q": "Respecto a la hipocalcemia, cual de los siguientes enunciados es incorrecto", "opts": ["Presenta temblores", "Presenta debilidad muscular", "Presenta signo de Chvostek y Trousseau", "Puede presentarse con tetania 41."], "correct": "B"}, {"n": 41, "q": "Con respecto al tratamiento de la hiperfosfatemia, marque la opción CORRECTA:", "opts": ["Indicar carbonato de calcio 1 a 2 g/día con las comidas.", "Al indicar quelantes de calcio no es necesario hacer restricción dietética de fosfato.", "Indicar carbonato de calcio 1 g/día lejos de las comidas.", "Restricción hídrica. 42."], "correct": "A"}, {"n": 42, "q": "Con respecto a la celulitis preseptal, marque la correcta:", "opts": ["Presenta afectación de la agudeza visual.", "Puede complicarse con la formación de un absceso local", "El tratamiento es exclusivamente local.", "Se diferencia de la celulitis orbitaria por la afectación de los senos paranasales. 43."], "correct": "B"}, {"n": 43, "q": "Las siguientes son complicaciones de celulitis orbitaria, EXCEPTO:", "opts": ["Absceso cerebral", "Meningitis", "Trombosis del seno cavernoso", "Mastoiditis 44."], "correct": "D"}, {"n": 44, "q": "¿Cuál de las siguientes es manifestación de acidosis metabólica?", "opts": ["Respiración de Kussmaul", "Temblores", "Apneas", "Hipertonias 45.8 Evaluaciones específicas - Pediatría Examen curso superior R1 Examen medicina interna R1 2026 Examen medicina interna R1 2026 Pregunta 45 Correcta Se puntúa 1,00 sobre 1,00 Marcar pregunta Enunciado de la pregunta"], "correct": "A"}, {"n": 45, "q": "Ingresa a internación un paciente de 2 años cursando una deshidratación aguda secundaria a gastroenteritis con intolerancia a la vía oral. Usted realiza un laboratorio y coloca un plan de hidratación parenteral. El EAB informa acidosis metabólica e hipokalemia moderada. ¿Qué alteraciones podría encontrar en el ECG?", "opts": ["Depresión del segmento ST", "Prolongación del PR", "Desaparición de ondas U", "Onda T picuda"], "correct": "A"}, {"n": 46, "q": "¿Cuál de los siguientes NO es un tratamiento adecuado para la hipercalcemia?", "opts": ["Vitamina D", "Furosemida", "Solución fisiológica 20 mL/kg EV en 1 h", "Bifosfonatos"], "correct": "A"}, {"n": 47, "q": "Acaba de evaluar a un bebé de 15 días de vida traído por el padre por presentar un vómito con estrías de sangre en 2 ocasiones en las últimas 24 hs. Antecedentes: RN 37 semanas EG, PN: 2.450 kg, sin antecedentes perinatológicos de importancia. Examen físico: bebé reactivo, conectado, en BEG, buen progreso de peso, PMLD exclusivo. ¿Qué conducta tomaría en 1er instancia?", "opts": ["Suspensión de PM, indica leche con hidrolizado proteico extenso.", "Exclusión de lácteos de la dieta materna", "Cita para nueva evaluación en compañía de su madre.", "Hemograma y coagulograma. 48."], "correct": "C"}, {"n": 48, "q": "Juan de 1 año y 6 meses es llevado a la guardia por su madre por presentar pérdida de sangre roja rutilante en materia fecal en 2 ocasiones (con y sin materia fecal forme). No refiere dolor. Afebril. El niño es sano, sin ningún antecedente de importancia. De los siguientes estudios, ¿cuál lo orientaría más en el diagnóstico de Juan?", "opts": ["Coprocultivo", "Ecografia abdominal", "VEDA", "Centellografía con Tc 99 49"], "correct": "D"}, {"n": 49, "q": "Identifique: ¿Cuál de las siguientes situaciones clínicas puede generar hiperkalemia en un niño previamente sano?", "opts": ["Nebulizaciones repetidas con agonistas B2", "Acidosis metabólica", "Alto flujo de glucosa con aumento consiguiente de la insulina", "Dieta con alto contenido de potasio"], "correct": "B"}, {"n": 50, "q": "Angel de 8 meses de edad, tiene como antecedentes de NPT (36 semanas)/PAEG, internado en neonatología. A los 5 días intervenido quirúrgicamente por enterocolitis necrotizante con resección de 15 cm de asa intestinal, conservación de válvula ileocecal y realización de colostomía en caño de escopeta. En el día de hoy se interna para cirugía programada de cierre de colostomía. Presenta estudios prequirúrgicos (laboratorio, ECG) normales. ¿Cuál es su conducta en relación a la profilaxis antibiótica?", "opts": ["Indica Ampicilina-sulbactam 50 mg/kg EV", "Indica Ampicilina 150 mg/kg EV", "Indica Cefalotina 100 mg/kg EV", "No requiere profilaxis antibiótica"], "correct": "A"}];let i=0,answers={};const L=['A','B','C','D'];
function draw(){
 const x=qs[i],chosen=answers[i];qnum.textContent=`Pregunta ${x.n} · ${i+1} de ${qs.length}`;q.textContent=x.q;opts.innerHTML='';
 x.opts.forEach((txt,k)=>{let b=document.createElement('button');b.className='opt';if(chosen&&x.correct){if(L[k]===x.correct)b.classList.add('reveal');if(L[k]===chosen)b.classList.add(chosen===x.correct?'correct':'wrong')}
 b.innerHTML=`<span class="letter">${L[k]}.</span>${txt}`;b.disabled=!!chosen;b.onclick=()=>{answers[i]=L[k];draw()};opts.appendChild(b)});
 feedback.textContent='';feedback.className='feedback';
 if(chosen&&!x.correct){feedback.textContent='Esta pregunta no se califica porque está incompleta en el PDF original.';feedback.classList.add('warn')}
 else if(chosen===x.correct){feedback.textContent='✓ Correcto';feedback.classList.add('ok')}
 else if(chosen){feedback.textContent=`✗ Incorrecto. La correcta es ${x.correct}.`;feedback.classList.add('bad')}
 const graded=Object.entries(answers).filter(([k,v])=>qs[k].correct).length, ok=Object.entries(answers).filter(([k,v])=>qs[k].correct&&v===qs[k].correct).length;
 meta.textContent=`${Object.keys(answers).length} respondidas · ${ok} correctas`;bar.style.width=((i+1)/qs.length*100)+'%';prev.disabled=i===0;next.textContent=i===qs.length-1?'Finalizar':'Siguiente →';
 grid.innerHTML='';qs.forEach((z,n)=>{let b=document.createElement('button');b.className='dot'+(answers[n]?' done':'')+(n===i?' cur':'');b.textContent=z.n;b.onclick=()=>{i=n;draw()};grid.appendChild(b)});scrollTo({top:0,behavior:'smooth'});
}
prev.onclick=()=>{if(i>0){i--;draw()}};next.onclick=()=>{if(i<qs.length-1){i++;draw()}else finish()};
function finish(){const gradable=qs.filter(x=>x.correct).length;let c=Object.entries(answers).filter(([k,v])=>qs[k].correct&&v===qs[k].correct).length;quiz.style.display='none';summary.style.display='block';score.textContent=`${c} / ${gradable}`;detail.textContent=`${Math.round(c/gradable*100)}% correctas sobre las ${gradable} preguntas calificables.`;scrollTo(0,0)}
restart.onclick=()=>{answers={};i=0;summary.style.display='none';quiz.style.display='block';draw()};draw();
